[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gramartico"
version = "0.1.0"
description = "Real-time writing assistant powered by heuristics"
readme = "README.md"
authors = [{name = "Gramartico Contributors"}]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: End Users/Desktop",
]

[project.urls]
Homepage = "https://example.com/gramartico"
